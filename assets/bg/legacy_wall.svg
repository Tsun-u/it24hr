<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 76" shape-rendering="crispEdges" preserveAspectRatio="xMidYMax slice">
  <!-- legacy 的辦公室：手刻的像素風。192×76 格。看得到的只有螢幕上方那條和螢幕之間的縫，所以東西都畫在上面三分之一。 -->
  <rect width="192" height="76" fill="#d9d3c3"/>
  <rect y="0" width="192" height="2" fill="#c8c1ae"/>
  <!-- 窗戶：矮而寬，放在筆電上方 -->
  <rect x="17" y="4" width="58" height="22" fill="#8c8578"/>
  <rect x="19" y="6" width="54" height="18" fill="#9fd3f0"/>
  <rect x="19" y="6" width="54" height="7" fill="#b9e3f7"/>
  <rect x="24" y="8" width="9" height="2" fill="#ffffff"/><rect x="26" y="7" width="4" height="1" fill="#ffffff"/>
  <rect x="52" y="10" width="11" height="2" fill="#ffffff"/><rect x="55" y="9" width="5" height="1" fill="#ffffff"/>
  <rect x="21" y="16" width="6" height="8" fill="#7f9bb3"/><rect x="28" y="13" width="5" height="11" fill="#6d8aa3"/>
  <rect x="35" y="18" width="8" height="6" fill="#86a2ba"/><rect x="45" y="14" width="5" height="10" fill="#6d8aa3"/>
  <rect x="52" y="17" width="9" height="7" fill="#7f9bb3"/><rect x="63" y="12" width="7" height="12" fill="#5f7c95"/>
  <rect x="23" y="18" width="1" height="1" fill="#f4e9b0"/><rect x="30" y="15" width="1" height="1" fill="#f4e9b0"/>
  <rect x="65" y="14" width="1" height="1" fill="#f4e9b0"/><rect x="55" y="19" width="1" height="1" fill="#f4e9b0"/>
  <rect x="19" y="21" width="12" height="3" fill="#5c9a5c"/><rect x="39" y="22" width="9" height="2" fill="#4f8a4f"/>
  <rect x="45" y="6" width="2" height="18" fill="#8c8578"/>
  <rect x="16" y="26" width="60" height="2" fill="#b3ab98"/>
  <!-- 海報：外接螢幕上方 -->
  <rect x="78" y="3" width="30" height="8" fill="#2d3b4e"/><rect x="79" y="4" width="28" height="6" fill="#3d5a80"/>
  <rect x="81" y="7" width="24" height="2" fill="#e0a458"/><rect x="83" y="5" width="8" height="1" fill="#98c1d9"/>
  <!-- 時鐘：右上 -->
  <rect x="3" y="6" width="12" height="12" fill="#6b4a2e"/><rect x="4" y="7" width="10" height="10" fill="#f6f1e7"/>
  <rect x="8" y="8" width="1" height="5" fill="#1f2328"/><rect x="8" y="12" width="4" height="1" fill="#1f2328"/>
  <!-- 便利貼在牆上 -->
  <rect x="120" y="4" width="6" height="6" fill="#fff5a6"/><rect x="128" y="5" width="6" height="6" fill="#ffd1dc"/>
  <!-- 右邊的盆栽，只露一點葉子 -->
  <rect x="184" y="20" width="5" height="6" fill="#3f8a4a"/><rect x="187" y="16" width="4" height="8" fill="#4fa05a"/>
</svg>
